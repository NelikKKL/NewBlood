name: Build JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build NewBlood Mod
    runs-on: windows-latest

    steps:
      # ── 1. Checkout source ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Find gradlew.bat and store its directory ─────────────────────────
      - name: Locate project root
        shell: pwsh
        run: |
          $gradlew = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "gradlew.bat" -Recurse -Depth 3 | Select-Object -First 1
          if (-not $gradlew) {
            Write-Error "gradlew.bat not found. Repository contents:"
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Depth 3 | Select-Object -First 40 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $projectRoot = $gradlew.DirectoryName
          Write-Host "Found gradlew.bat at: $($gradlew.FullName)"
          echo "PROJECT_ROOT=$projectRoot" >> $env:GITHUB_ENV

      # ── 3. Set up Java 17 (required by fabric-loom & MC 1.20.1) ────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Cache Gradle dependencies & Fabric/Minecraft caches ─────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~\.gradle\caches
            ~\.gradle\wrapper
            ~\.gradle\loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 5. Build the mod ────────────────────────────────────────────────────
      - name: Build with Gradle
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          & .\gradlew.bat build --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"

      # ── 6. Stage the remapped JAR to a fixed folder ─────────────────────────
      #    upload-artifact struggles with backslash env vars and negation globs,
      #    so we copy the final JAR to a predictable path first.
      - name: Stage JAR for upload
        shell: pwsh
        run: |
          $libs = Join-Path $env:PROJECT_ROOT "build\libs"
          $staging = Join-Path $env:GITHUB_WORKSPACE "staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Get-ChildItem -Path $libs -Filter "*.jar" |
            Where-Object { $_.Name -notmatch "-dev\.jar$" -and $_.Name -notmatch "-sources\.jar$" } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination $staging
              Write-Host "Staged: $($_.Name)"
            }

      # ── 7. Upload the built JAR as a workflow artifact ──────────────────────
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: newblood-${{ github.sha }}
          path: staging/*.jar
          if-no-files-found: error
          retention-days: 30
