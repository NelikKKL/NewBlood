name: Build JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build NewBlood Mod
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Find gradlew and store its directory ─────────────────────────────
      - name: Locate project root
        run: |
          GRADLEW=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "gradlew" -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "❌ gradlew not found anywhere in the repository"
            find "$GITHUB_WORKSPACE" -maxdepth 3 | head -40
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$GRADLEW")
          echo "✅ Found gradlew at: $GRADLEW"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      # ── 3. Set up Java 17 (required by fabric-loom & MC 1.20.1) ────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Cache Gradle dependencies & Fabric/Minecraft caches ─────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 5. Make gradlew executable ──────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x "$PROJECT_ROOT/gradlew"

      # ── 6. Build the mod (produces remapped JAR in build/libs/) ────────────
      - name: Build with Gradle
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"

      # ── 7. Upload the built JAR as a workflow artifact ──────────────────────
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: newblood-${{ github.sha }}
          path: |
            ${{ env.PROJECT_ROOT }}/build/libs/*.jar
            !${{ env.PROJECT_ROOT }}/build/libs/*-dev.jar
            !${{ env.PROJECT_ROOT }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
